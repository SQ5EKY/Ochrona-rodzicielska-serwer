<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Rodzica - Logowanie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h3 class="text-center mb-4">Stealth Parental</h3>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="alert alert-success">{{ success }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">Adres e-mail</label>
                <input type="email" name="email" class="form-control" required placeholder="jan@kowalski.pl">
            </div>
            <div class="mb-3">
                <label class="form-label">Hasło</label>
                <input type="password" name="password" class="form-control" required placeholder="Wpisz hasło...">
            </div>
            <button type="submit" class="btn btn-primary w-100">Zaloguj się</button>
        </form>
        <div class="text-center mt-3">
            <a href="/register" class="text-decoration-none">Nie masz konta? Zarejestruj się</a>
        </div>
    </div>
</body>
</html>
